# 自建前置反代真实客户端 IP 还原
# 用途：当站点前置是自建反代(如 nginx 反代、docker-ip-ssl-proxy 等，转发时带
#       X-Forwarded-For)时，把源站 nginx 的 $remote_addr 从反代节点 IP 还原为
#       真实访客 IP，使 human-gate 记录到真实用户而非反代 IP。
#
# 安全要点(重要)：
#   - 只把你自己的反代节点 IP 列入 set_real_ip_from 白名单。
#   - X-Forwarded-For 是可伪造的普通 HTTP 头。若源站 IP 对外暴露、可被直连，
#     切勿使用 set_real_ip_from 0.0.0.0/0，否则任何人都能伪造访客 IP、污染
#     数据甚至陷害无辜 IP。名单外的直连来源不会被采信，其真实来源 IP 会被如实记录。
#   - 反代增删节点/更换 IP 时，记得同步更新本名单。
#
# 用法：在站点 server{} 块内 include 本文件。放到不会被 nginx/*.conf 通配符
#       扫到的子目录(如 realip/)再 include，避免 real_ip_header 重复报错。

# ↓↓↓ 替换为你自己的反代节点 IP（可多行；也支持 CIDR，如 1.2.3.0/24）
set_real_ip_from 203.0.113.10;
set_real_ip_from 203.0.113.11;
# set_real_ip_from 198.51.100.0/24;

# 如反代前面还叠了 Cloudflare，可一并 include realip-cloudflare.conf 里的 CF 段。

real_ip_header X-Forwarded-For;
real_ip_recursive on;
